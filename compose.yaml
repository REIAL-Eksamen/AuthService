services:

  vault:
    image: hashicorp/vault:latest
    ports:
      - "8201:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    cap_add:
      - IPC_LOCK

  auth-service:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - vault
      - user-service
  
  user-service:
    build:
      context: ../UserService/UserService
    ports:
      - "5047:8080"
    env_file:
      - .env